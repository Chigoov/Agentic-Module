<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kantor Riset AAI</title><style>:root{color-scheme:light dark}body{margin:0;padding:16px;background:light-dark(#eef3f8,#151e29)}main{max-width:1500px;margin:auto}@media(max-width:560px){body{padding:0}}</style></head><body><main><div id="aai-studio-v2" aria-label="Pratinjau kantor riset AAI">
<style>
#aai-studio-v2{--canvas:light-dark(#eef3f8,#151e29);--panel:light-dark(#fff,#233040);--ink:light-dark(#172b43,#eff5fe);--muted:light-dark(#60728a,#bac8da);--line:light-dark(#dde6f0,#3b4a60);--accent:light-dark(#2d63dc,#87b2ff);--accentText:light-dark(#fff,#122945);--soft:light-dark(#eef4ff,#314565);font:14px/1.5 system-ui,sans-serif;color:var(--ink)}
#aai-studio-v2 *{box-sizing:border-box}#aai-studio-v2 button{font:inherit}#aai-studio-v2 button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}#aai-studio-v2 button:disabled{opacity:.45;cursor:default}
#aai-studio-v2 .shell{background:var(--canvas);padding:18px;border-radius:20px}#aai-studio-v2 .header{display:flex;gap:20px;align-items:center;justify-content:space-between;margin-bottom:15px;padding-right:88px;flex-wrap:wrap}#aai-studio-v2 .brand{display:flex;gap:10px;align-items:center}#aai-studio-v2 .brandmark{display:grid;place-items:center;width:40px;height:40px;background:var(--ink);color:var(--panel);border-radius:12px;font-size:12px;font-weight:750;letter-spacing:1px}#aai-studio-v2 h2{font-size:18px;letter-spacing:-.4px;margin:0;font-weight:650}#aai-studio-v2 .caption{color:var(--muted);font-size:12px}#aai-studio-v2 .demo{font-size:11px;letter-spacing:.5px;border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:5px 10px}#aai-studio-v2 .metrics{display:flex;gap:24px;flex-wrap:wrap}#aai-studio-v2 .metric{font-size:11px;color:var(--muted)}#aai-studio-v2 .metric b{display:block;color:var(--ink);font-size:19px;letter-spacing:-.5px;font-weight:650;font-variant-numeric:tabular-nums}
#aai-studio-v2 .main{display:grid;grid-template-columns:210px minmax(0,1fr);gap:14px}#aai-studio-v2 .feed{background:var(--panel);border-radius:14px;padding:16px;min-width:0}#aai-studio-v2 h3{font-size:13px;font-weight:650;margin:0 0 12px}#aai-studio-v2 .phase-chip{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--accent);background:var(--soft);padding:9px 10px;border-radius:8px;margin-bottom:12px}#aai-studio-v2 .event{border-top:1px solid var(--line);padding:12px 0;display:flex;gap:9px;align-items:flex-start;font-size:12px}#aai-studio-v2 .event .event-copy{min-width:0;overflow-wrap:anywhere}#aai-studio-v2 .event strong{font-weight:650;display:block}#aai-studio-v2 .event small{display:block;color:var(--muted);font-size:11px;margin-top:3px}#aai-studio-v2 .initial{width:25px;height:25px;display:grid;place-items:center;flex:none;border-radius:50%;background:var(--soft);color:var(--accent);font-size:11px;font-weight:650}
#aai-studio-v2 .world-panel{background:var(--panel);border-radius:14px;min-width:0;overflow:hidden}#aai-studio-v2 .toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;flex-wrap:wrap}#aai-studio-v2 .tools{display:flex;gap:7px;flex-wrap:wrap}#aai-studio-v2 .tool{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:12px;color:var(--ink)}#aai-studio-v2 .tool.main-action{background:var(--accent);color:var(--accentText);border-color:transparent}
#aai-studio-v2 .world{position:relative;aspect-ratio:3/2;background:#eef3f8;isolation:isolate;overflow:hidden}#aai-studio-v2 .room{display:block;width:100%;height:100%;object-fit:contain;user-select:none;pointer-events:none}#aai-studio-v2 .actor{position:absolute;width:11%;height:22%;transform:translate(-50%,-100%);transition:left 1.9s cubic-bezier(.45,.08,.25,1),top 1.9s cubic-bezier(.45,.08,.25,1);z-index:3}#aai-studio-v2 .sprite{display:block;width:100%;height:100%;background-image:url('/assets/research-team.webp');background-size:400% 200%;background-position-y:0%;transform-origin:50% 88%;filter:drop-shadow(0 3px 2px #24334430)}#aai-studio-v2 .actor.walking .sprite{background-position-y:100%;animation:aai-walk-v2 .32s ease-in-out 6}#aai-studio-v2 .actor.working .sprite{animation:aai-work-v2 1.2s ease-in-out infinite}#aai-studio-v2 .actor.selected .sprite{filter:drop-shadow(0 0 5px #3678ff65)}#aai-studio-v2 .nameplate{position:absolute;bottom:99%;left:50%;transform:translateX(-50%);display:flex;gap:5px;align-items:center;white-space:nowrap;border:1px solid #ffffffaa;border-radius:16px;padding:3px 8px;background:#ffffffed;box-shadow:0 3px 10px #23364b19;color:#21354c;font-size:11px;pointer-events:none}#aai-studio-v2 .nameplate .dot{width:5px;height:5px;background:#3d8b74;border-radius:50%}#aai-studio-v2 .nameplate.waiting .dot{background:#b17e38}#aai-studio-v2 .nameplate .short{display:none}#aai-studio-v2 .scene-note{position:absolute;bottom:9px;left:12px;font-size:11px;color:#526d83;background:#ffffffed;border-radius:20px;padding:4px 9px}#aai-studio-v2 .scene-note i{vertical-align:middle}
#aai-studio-v2 .bottom-strip{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 14px;font-size:12px;flex-wrap:wrap}#aai-studio-v2 .connection{display:flex;align-items:center;gap:7px;color:var(--muted)}#aai-studio-v2 .connection .lamp{width:6px;height:6px;background:var(--muted);border-radius:50%}#aai-studio-v2 .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}#aai-studio-v2 .agent{min-width:0;text-align:left;display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px;color:var(--ink)}#aai-studio-v2 .agent[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}#aai-studio-v2 .portrait{width:33px;height:42px;flex:none;background-image:url('/assets/research-team.webp');background-size:400% 200%;background-position-y:0%;border-radius:6px;background-color:#eef3f8}#aai-studio-v2 .agent-copy{min-width:0}#aai-studio-v2 .agent strong{font-size:12px;font-weight:650;display:block}#aai-studio-v2 .agent .task{font-size:11px;display:block;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}#aai-studio-v2 .agent .state{font-size:11px;display:block;margin-top:7px;color:var(--accent)}#aai-studio-v2 .detail{margin-top:12px;font-size:12px;color:var(--muted);overflow-wrap:anywhere}#aai-studio-v2 .motion-off .actor{transition:none}#aai-studio-v2 .motion-off .sprite{animation:none}
@keyframes aai-walk-v2{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-3px) rotate(1deg)}}@keyframes aai-work-v2{0%,100%{transform:rotate(0deg)}50%{transform:rotate(.9deg)}}
@media(prefers-reduced-motion:reduce){#aai-studio-v2 .actor{transition:none}#aai-studio-v2 .sprite{animation:none!important}}
@media(max-width:800px){#aai-studio-v2 .main{grid-template-columns:170px minmax(0,1fr)}#aai-studio-v2 .header{gap:10px}#aai-studio-v2 .metrics{gap:16px}#aai-studio-v2 .cards{grid-template-columns:repeat(2,minmax(0,1fr))}#aai-studio-v2 .nameplate .full{display:none}#aai-studio-v2 .nameplate .short{display:inline}#aai-studio-v2 .feed{padding:12px}}
@media(max-width:560px){#aai-studio-v2 .shell{padding:10px}#aai-studio-v2 .main{display:flex;flex-direction:column}#aai-studio-v2 .world-panel{order:-1}#aai-studio-v2 .header{padding-right:65px}#aai-studio-v2 .metrics{gap:14px}#aai-studio-v2 .tool{min-height:44px}#aai-studio-v2 .toolbar{padding:10px}#aai-studio-v2 .agent{padding:10px;gap:6px}#aai-studio-v2 .nameplate{padding:2px 6px}#aai-studio-v2 .event{padding:9px 0}#aai-studio-v2 .scene-note{bottom:5px;left:7px;font-size:11px}#aai-studio-v2 .portrait{width:26px;height:35px}}
#aai-studio-v2 .job-picker{display:flex;align-items:center;gap:8px;font-size:12px;min-width:0;flex-wrap:wrap}#aai-studio-v2 select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;max-width:350px;min-width:0;width:min(350px,100%)}#aai-studio-v2 .motion-switch{font-size:12px;display:flex;align-items:center;gap:5px;min-height:44px}#aai-studio-v2 a.tool{text-decoration:none}#aai-studio-v2 .tool{min-height:44px}#aai-studio-v2 .header{padding-right:0}#aai-studio-v2 .event .error{color:light-dark(#a82323,#ffb4b4)}#aai-studio-v2 .feed{max-height:none}#aai-studio-v2 .actor.inactive{opacity:.55}
</style>
<div class="shell">
 <header class="header"><div class="brand"><div class="brandmark">AAI</div><div><h2>Kantor Riset</h2><div class="caption">AUTONOMI AGENTIC ILMIAH · monitor lokal</div></div></div><div class="metrics"><div class="metric">KANDIDAT TERCATAT<b data-value="candidates">—</b></div><div class="metric">DOKUMEN DIPROSES<b data-value="read">—</b></div><div class="metric">AGENT AKTIF<b data-value="workers">0</b></div></div></header>
 <div class="main">
  <aside class="feed"><h3>Aktivitas tim</h3><div class="phase-chip"><i data-lucide="layers" aria-hidden="true"></i><span data-value="phase">Menunggu pekerjaan</span></div><div data-value="events" aria-live="polite"></div><div class="caption" data-value="blocked"></div></aside>
  <section class="world-panel" aria-label="Kantor virtual animasi"><div class="toolbar"><label class="job-picker">Pekerjaan <select aria-label="Pilih pekerjaan" data-value="job-select"><option value="">Menunggu pekerjaan</option></select></label><div class="tools"><label class="motion-switch"><input type="checkbox" data-action="motion" checked> Gerakan</label><a class="tool" href="/workflow">Monitor tahapan</a></div></div><div class="world"><img class="room" src="/assets/research-office.jpg" alt="Kantor riset isometrik dengan empat meja kayu, jendela besar, perpustakaan, tanaman, sofa, dan ruang rapat kaca"><div data-value="actors"></div><div class="scene-note">Klik kartu agent untuk melihat tugasnya</div></div><div class="bottom-strip"><span data-value="sequence">Menunggu aktivitas</span><span class="connection" data-value="connection">Menghubungkan…</span></div></section>
 </div><div class="cards" data-value="cards"></div><div class="detail" aria-live="polite" data-value="detail">Pilih kartu agent untuk melihat aktivitas sebenarnya.</div>
</div>
</div></main><script src="/assets/office.js"></script></body></html>
